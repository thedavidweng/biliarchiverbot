name: CI

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        env:
          BILIARCHIVER_WEBAPP: https://example.com/
          BILIARCHIVER_USERNAME: example
          BILIARCHIVER_API: https://example.com/
          BILIARCHIVER_BOT: example
        run: pnpm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: biliarchiverbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test production container
        run: |
          docker run -d --name biliarchiverbot-ci \
            -p 5173:5173 \
            -e BILIARCHIVER_WEBAPP=https://example.com/ \
            -e BILIARCHIVER_USERNAME=example \
            -e BILIARCHIVER_API=https://example.com/ \
            -e BILIARCHIVER_BOT=0000000000:TEST \
            biliarchiverbot:ci
          for i in $(seq 1 30); do
            if wget -q --spider http://127.0.0.1:5173/favicon.png; then
              echo "container is healthy"
              docker rm -f biliarchiverbot-ci
              exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy"
          docker logs biliarchiverbot-ci || true
          docker rm -f biliarchiverbot-ci || true
          exit 1

      - name: Build Docker image (arm64, no load)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: biliarchiverbot:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
