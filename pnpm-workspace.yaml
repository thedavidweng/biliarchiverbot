# Single-package project; settings live here for pnpm 11+.
packages:
  - '.'

engineStrict: true

overrides:
  rollup: 'npm:@rollup/wasm-node'
  'cookie@<0.7.0': '>=0.7.0'

# svelte-virtual ships a preinstall guard that is unnecessary once installed via pnpm.
allowBuilds:
  svelte-virtual: false

# Allow freshly published toolchain packages during intentional upgrades.
minimumReleaseAgeExclude:
  - svelte-check
  - svelte
  - '@sveltejs/*'
  - vite
  - grammy
  - fast-xml-parser
  - ts-results-es
